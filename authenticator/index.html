<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting to Microsoft Authenticator...</title>
  <script>
    var userAgent = navigator.userAgent || navigator.vendor || window.opera;

    if (/android/i.test(userAgent)) {
      window.location.replace("https://play.google.com/store/apps/details?id=com.azure.authenticator&hl=de");
    } else if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
      window.location.replace("https://apps.apple.com/ca/app/microsoft-authenticator/id983156458");
    } else {
      window.location.replace("https://support.microsoft.com/en-us/authenticator/download-microsoft-authenticator");
    }
  </script>
</head>
<body>
  <p>Redirecting you to Microsoft Authenticator...</p>
</body>
</html>
