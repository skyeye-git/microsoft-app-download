<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting to Microsoft Outlook...</title>
  <script>
    var userAgent = navigator.userAgent || navigator.vendor || window.opera;

    if (/android/i.test(userAgent)) {
      window.location.replace("https://play.google.com/store/apps/details?id=com.microsoft.office.outlook");
    } else if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
      window.location.replace("https://play.google.com/store/apps/details?id=com.microsoft.office.outlook");
    } else {
      window.location.replace("https://apps.microsoft.com/detail/9nrx63209r7b");
    }
  </script>
</head>
<body>
  <p>Redirecting you to Microsoft Outlook...</p>
</body>
</html>
