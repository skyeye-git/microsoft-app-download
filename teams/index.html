<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting to Microsoft Teams...</title>
  <script>
    var userAgent = navigator.userAgent || navigator.vendor || window.opera;

    if (/android/i.test(userAgent)) {
      window.location.replace("https://play.google.com/store/apps/details?id=com.microsoft.teams");
    } else if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
      window.location.replace("https://apps.apple.com/ca/app/microsoft-teams/id1113153706");
    } else {
      window.location.replace("https://apps.microsoft.com/detail/xp8bt8dw290mpq");
    }
  </script>
</head>
<body>
  <p>Redirecting you to Microsoft Teams...</p>
</body>
</html>
